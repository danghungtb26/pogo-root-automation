name: CI

on:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Shell syntax
        run: |
          bash -n scripts/package-magisk.sh
          bash -n scripts/device-smoke-test.sh
          bash -n scripts/bluestacks-smoke-test.sh
          bash -n scripts/binding-probe-test.sh
          bash -n scripts/collect-binding-diagnostics.sh
          bash -n scripts/vendor-pogoenhancer-libs.sh
          bash -n scripts/headless-control.sh
          sh -n zygisk/module/bin/runtime-status.sh
          sh -n zygisk/module/post-fs-data.sh
          sh -n zygisk/module/uninstall.sh

      - name: Native command protocol test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Izygisk/jni \
            zygisk/jni/runtime_command_protocol_test.cpp \
            -o "$RUNNER_TEMP/runtime_command_protocol_test"
          "$RUNNER_TEMP/runtime_command_protocol_test"

      - name: Verify vendored PogoEnhancer libraries
        run: |
          test "$(git hash-object app/libs/POGOProtos-2.60.8.jar)" = "e183c559262427fef17a9c82af585e67dab4e753"
          test "$(git hash-object app/libs/bcpkix-jdk15on-1.60.jar)" = "87ce8b473aeb3200c6ab63af512e25030f180658"
          test "$(git hash-object app/libs/bcprov-jdk15on-1.60.jar)" = "5be567cbb3dee2cc616602a479b97f05d0498efd"
          test "$(git hash-object app/libs/parser-1.6.0.aar)" = "477b7512e2aa76283330de9e659635a4f9a19680"
          test "$(git hash-object app/libs/virtualjoystick-1.10.1.aar)" = "de697c4501bf8b2fac31343b1bee7f572eee208c"

      - name: Unit tests
        run: gradle :core:test :game-adapter:api:test :game-adapter:fake:test :game-adapter:pogo:test :bridge:protocol:test

      - name: Build controller APK
        run: gradle :app:assembleDebug

      - name: Fetch canonical Zygisk API header
        run: |
          mkdir -p "$RUNNER_TEMP/zygisk-api"
          curl -fsSL \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp \
            -o "$RUNNER_TEMP/zygisk-api/zygisk.hpp"

      - name: Build arm64 Zygisk runtime
        run: |
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          "$CMAKE" \
            -S zygisk/jni \
            -B build/zygisk-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DZYGISK_API_DIR="$RUNNER_TEMP/zygisk-api"
          "$CMAKE" --build build/zygisk-arm64

      - name: Build x86_64 Zygisk runtime
        run: |
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          "$CMAKE" \
            -S zygisk/jni \
            -B build/zygisk-x86_64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-28 \
            -DZYGISK_API_DIR="$RUNNER_TEMP/zygisk-api"
          "$CMAKE" --build build/zygisk-x86_64

      - name: Package multi-ABI Magisk module
        run: |
          ./scripts/package-magisk.sh \
            build/zygisk-arm64/libpogo_root_automation.so \
            build/zygisk-x86_64/libpogo_root_automation.so \
            build/pogo-root-automation-magisk-multiabi.zip
          test -s build/pogo-root-automation-magisk-multiabi.zip
          unzip -l build/pogo-root-automation-magisk-multiabi.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -l build/pogo-root-automation-magisk-multiabi.zip | grep -q 'zygisk/x86_64.so'

      - uses: actions/upload-artifact@v4
        with:
          name: pogo-root-automation-branch-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/pogo-root-automation-magisk-multiabi.zip
