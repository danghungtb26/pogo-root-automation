name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Shell syntax
        run: |
          bash -n scripts/build-magisk.sh
          bash -n scripts/logcat-full.sh
          bash -n scripts/lib/emulator.sh
          bash -n scripts/package-magisk.sh
          bash -n scripts/collect-binding-diagnostics.sh
          bash -n scripts/vendor-pogoenhancer-libs.sh
          sh -n zygisk/module/bin/runtime-status.sh
          sh -n zygisk/module/post-fs-data.sh
          sh -n zygisk/module/uninstall.sh

      - name: Verify vendored PogoEnhancer libraries
        run: |
          test "$(git hash-object app/libs/POGOProtos-2.60.8.jar)" = "e183c559262427fef17a9c82af585e67dab4e753"
          test "$(git hash-object app/libs/bcpkix-jdk15on-1.60.jar)" = "87ce8b473aeb3200c6ab63af512e25030f180658"
          test "$(git hash-object app/libs/bcprov-jdk15on-1.60.jar)" = "5be567cbb3dee2cc616602a479b97f05d0498efd"
          test "$(git hash-object app/libs/parser-1.6.0.aar)" = "477b7512e2aa76283330de9e659635a4f9a19680"
          test "$(git hash-object app/libs/virtualjoystick-1.10.1.aar)" = "de697c4501bf8b2fac31343b1bee7f572eee208c"

      - name: Build canonical multi-ABI module
        run: ./scripts/build-magisk.sh

      - name: Test native readiness, navigation and telemetry
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Izygisk/jni \
            zygisk/tests/runtime_readiness_retry_test.cpp -o /tmp/runtime_readiness_retry_test
          /tmp/runtime_readiness_retry_test
          c++ -std=c++17 -Wall -Wextra -Werror -Izygisk/jni \
            zygisk/tests/runtime_auto_fort_navigation_test.cpp -o /tmp/runtime_auto_fort_navigation_test
          /tmp/runtime_auto_fort_navigation_test
          c++ -std=c++17 -Wall -Wextra -Werror -Izygisk/jni/shared/bridge_kotlin \
            zygisk/tests/runtime_automation_event_protocol_test.cpp -o /tmp/runtime_automation_event_protocol_test
          /tmp/runtime_automation_event_protocol_test
          c++ -std=c++17 -Wall -Wextra -Werror -Izygisk/jni \
            zygisk/tests/runtime_automation_subject_names_test.cpp -o /tmp/runtime_automation_subject_names_test
          /tmp/runtime_automation_subject_names_test
          c++ -std=c++17 -Wall -Wextra -Werror -Izygisk/jni \
            zygisk/tests/runtime_discard_filter_factory_test.cpp -o /tmp/runtime_discard_filter_factory_test
          /tmp/runtime_discard_filter_factory_test
          c++ -std=c++17 -Wall -Wextra -Werror -Izygisk/jni \
            zygisk/tests/runtime_discard_preparation_test.cpp -o /tmp/runtime_discard_preparation_test
          /tmp/runtime_discard_preparation_test

      - name: Test and build controller APK
        run: ./gradlew test assembleDebug

      - name: Inspect standalone and bundled module artifacts
        run: |
          test -s build/pogo-root-automation-magisk-multiabi.zip
          test -s build/pogo-root-automation-magisk-multiabi.manifest.json
          unzip -l build/pogo-root-automation-magisk-multiabi.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -l build/pogo-root-automation-magisk-multiabi.zip | grep -q 'zygisk/x86_64.so'
          test "$(sha256sum build/pogo-root-automation-magisk-multiabi.zip | cut -d ' ' -f 1)" = \
            "$(jq -r '.zipSha256' build/pogo-root-automation-magisk-multiabi.manifest.json)"
          test "$(unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -c '^assets/pogo-module/.*\.zip$')" -eq 1
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/pogo-module/pogo-root-automation-magisk-multiabi.zip \
            > "$RUNNER_TEMP/bundled-module.zip"
          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            assets/pogo-module/pogo-root-automation-magisk-multiabi.manifest.json \
            > "$RUNNER_TEMP/bundled-module.manifest.json"
          cmp build/pogo-root-automation-magisk-multiabi.manifest.json \
            "$RUNNER_TEMP/bundled-module.manifest.json"
          test "$(sha256sum "$RUNNER_TEMP/bundled-module.zip" | cut -d ' ' -f 1)" = \
            "$(jq -r '.zipSha256' "$RUNNER_TEMP/bundled-module.manifest.json")"

      - uses: actions/upload-artifact@v4
        with:
          name: pogo-root-automation-branch-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/pogo-root-automation-magisk-multiabi.zip
            build/pogo-root-automation-magisk-multiabi.manifest.json
