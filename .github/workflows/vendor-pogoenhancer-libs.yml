name: Vendor PogoEnhancer libs

on:
  push:
    branches:
      - feat/m4-pogoenhancer-joystick
    paths:
      - scripts/vendor-pogoenhancer-libs.sh
      - .github/workflows/vendor-pogoenhancer-libs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor pinned binaries
        run: bash scripts/vendor-pogoenhancer-libs.sh

      - name: Commit vendored binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs
          if git diff --cached --quiet; then
            echo "Vendored libraries are already up to date."
            exit 0
          fi
          git commit -m "build: vendor pinned PogoEnhancer binaries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
